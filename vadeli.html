    <script>
        // --- VHESAP ANALYTICS & ADS SYSTEM (Enterprise Entagrasyonu) ---
        function trackEvent(eventName, params = {}) {
            try {
                const analyticsConf = JSON.parse(localStorage.getItem('vhesap_analytics_config') || '{"enabled":true,"events":{}}');
                if (!analyticsConf.enabled) return;
                
                const evConf = analyticsConf.events && analyticsConf.events[eventName];
                if (evConf && evConf.enabled === false) return;
                
                // Google Analytics GA4 Push
                if (typeof gtag === 'function') gtag('event', eventName, params);
                
                // Local Vhesap Stats Push
                const today = new Date().toISOString().split('T')[0];
                const rawStats = localStorage.getItem('vhesap_analytics_stats') || '{}';
                let stats = JSON.parse(rawStats);
                
                if (!stats[today]) {
                    stats[today] = { users: 1, calculations: 0, ad_impressions: 0, ad_clicks: 0, affiliate_clicks: 0, pdf_downloads: 0, modules: {}, events: {} };
                }
                
                if (eventName === 'calculation_complete') {
                    stats[today].calculations++;
                    let mod = params.module || 'vadeli_genel';
                    stats[today].modules[mod] = (stats[today].modules[mod] || 0) + 1;
                } else if (eventName === 'ad_impression') stats[today].ad_impressions++;
                else if (eventName === 'ad_click') stats[today].ad_clicks++;
                else if (eventName === 'affiliate_click') stats[today].affiliate_clicks++;
                else if (eventName === 'payment_plan_download_pdf') stats[today].pdf_downloads++;
                
                stats[today].events[eventName] = (stats[today].events[eventName] || 0) + 1;
                localStorage.setItem('vhesap_analytics_stats', JSON.stringify(stats));
            } catch(e) { console.warn("Analytics error", e); }
        }

        function getAdHtml(placement) {
            try {
                let ads = [];
                // Önce canlı ads.js kontrolü, yoksa yerel admin taslağına bak
                if (window.GLOBAL_ADS) {
                    ads = window.GLOBAL_ADS;
                } else {
                    const draft = localStorage.getItem('vhesap_ads_draft_vamber_2');
                    if (draft) ads = JSON.parse(draft);
                }

                const activeAds = ads.filter(a => a.active && a.placement === placement);
                if (activeAds.length === 0) return '';
                
                activeAds.sort((a,b) => b.priority - a.priority);
                const ad = activeAds[0];
                
                setTimeout(() => trackEvent('ad_impression', { placement: placement }), 200);

                if(ad.type === 'AdSense') {
                    return `<div class="w-full my-2 text-center" onclick="trackEvent('ad_click', { type: 'adsense' })">${ad.scriptCode}</div>`;
                } else {
                    let cleanDesc = ad.description ? ad.description.replace(/<[^>]*>?/gm, '') : '';
                    return `
                    <a href="${ad.link}" target="_blank" onclick="trackEvent('ad_click', { placement: '${placement}' })" class="block w-full my-2 ${ad.transparentBg ? 'bg-[var(--apple-card)]' : 'bg-gradient-to-r from-amber-500/10 to-amber-500/5'} border border-[var(--apple-card-border)] rounded-xl p-3 transition-all hover:scale-[1.01] shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-[var(--apple-input-bg)] flex items-center justify-center text-[var(--apple-yellow)] text-lg flex-shrink-0">
                                <i class="${ad.icon || 'fa-solid fa-star'}"></i>
                            </div>
                            <div class="flex-1 text-left">
                                <div class="flex items-center gap-2 mb-0.5">
                                    <span class="bg-[var(--apple-badge-bg)] text-[var(--apple-yellow)] px-1.5 py-0.5 rounded text-[8px] font-bold tracking-wider border border-[var(--apple-badge-border)]">${ad.badge || 'Sponsor'}</span>
                                </div>
                                <h4 class="text-[12px] font-bold text-[var(--apple-text)] leading-tight">${ad.title}</h4>
                                <div class="text-[10px] text-[var(--apple-text-muted)] line-clamp-1 mt-0.5">${cleanDesc}</div>
                            </div>
                            <div class="flex items-center justify-center bg-[var(--apple-yellow)] text-black px-3 py-1.5 rounded-lg text-[10px] font-bold flex-shrink-0">
                                ${ad.buttonText || 'İncele'}
                            </div>
                        </div>
                    </a>`;
                }
            } catch(e) { return ''; }
        }

        function renderAds(placement, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = getAdHtml(placement);
        }
        // ---------------------------------------------

        // GLOBAL STATE & UTILS
        let globalRates = null;
        const publicHolidays = ["01-01", "04-23", "05-01", "05-19", "07-15", "08-30", "10-29", "2026-03-20", "2026-03-21", "2026-03-22", "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30"];
        
        const state = {
            main: 'vadeli', 
            sub: 'vadeli-tl', 
            lastCalc: null, 
            faizTipi: 'yillik',
            calcMeta: {},
            vadeliKarsilastirmalar: [],
            currentVadeliNet: 0,
            currentVadeliDays: 0,
            currentVadeliTutar: 0,
            currentVadeliOran: 0
        };

        const NAV_LABELS = { 'vadeli-tl': 'TL', 'vadeli-usd': 'USD', 'vadeli-eur': 'EUR', 'vadeli-altin': 'ALTIN' };

        function id(x) { return document.getElementById(x); }
        function getRaw(x) { return parseFloat(id(x)?.value.replace(/\./g, '').replace(',', '.')) || 0; }
        
        function format(n) { 
            let c = 'TRY';
            if (state.sub === 'vadeli-usd') c = 'USD';
            else if (state.sub === 'vadeli-eur') c = 'EUR';
            else if (state.sub === 'vadeli-altin') return fN(n) + ' GR';
            return new Intl.NumberFormat('tr-TR', {style:'currency',currency:c}).format(n);
        }

        function fN(n) { return (parseFloat(n) || 0).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
        function mask(e) { let v = e.value.replace(/\D/g, ""); e.value = v ? new Intl.NumberFormat('tr-TR').format(v) : ""; }
        function showToast(msg) {
            const toast = id('toast-container'); id('toast-message').innerText = msg;
            toast.style.transform = 'translate(-50%, 0)'; toast.style.opacity = '1';
            setTimeout(() => { toast.style.transform = 'translate(-50%, -20px)'; toast.style.opacity = '0'; }, 4000);
        }

        function applyTheme() {
            const savedTheme = localStorage.getItem('vhesap_global_theme') || 'dark';
            if (savedTheme === 'light') { document.body.classList.remove('dark'); }
            else { document.body.classList.add('dark'); }
        }

        window.onload = () => {
            applyTheme();
            
            window.addEventListener('storage', (e) => {
                if (e.key === 'vhesap_global_theme') applyTheme();
            });
            
            fetch('rates.json', { cache: 'no-store' })
            .then(r => {
                if (!r.ok) throw new Error('rates.json bulunamadı');
                return r.json();
            })
            .then(data => { 
                globalRates = data; 
                switchSub('vadeli-tl'); 
            })
            .catch(e => { 
                console.log('rates.json okunamadı, yerel taslak kullanılacak.'); 
                const draftRates = localStorage.getItem('vhesap_rates_draft_v2');
                if (draftRates) {
                    try { globalRates = JSON.parse(draftRates); } catch(err) {}
                }
                switchSub('vadeli-tl'); 
            });

            renderAds('homeBottom', 'ad-container-bottom');
            trackEvent('page_view', { page: 'vadeli' });
        };

        function isBusinessDay(d) {
            let day = d.getDay(); if (day === 0 || day === 6) return false;
            let mmdd = String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
            let yyyymmdd = d.getFullYear() + "-" + mmdd;
            return !(publicHolidays.includes(mmdd) || publicHolidays.includes(yyyymmdd));
        }

        function onStartDateChange() {
            let st = new Date(id('date-start').value);
            let days = parseInt(id('val-vade').value) || 0;
            st.setDate(st.getDate() + days); 
            id('date-first').value = st.toISOString().split('T')[0];
        }

        function onVadeChange() {
            let st = new Date(id('date-start').value); let days = parseInt(id('val-vade').value) || 0;
            if (days < 0) { days = 0; id('val-vade').value = 0; }
            st.setDate(st.getDate() + days); id('date-first').value = st.toISOString().split('T')[0];
        }

        function onDateFirstChange() {
            let st = new Date(id('date-start').value); let end = new Date(id('date-first').value);
            if(end >= st) { id('val-vade').value = Math.round((end - st) / 86400000); } 
            else { id('date-first').value = id('date-start').value; id('val-vade').value = 0; }
        }

        function switchSub(subId) {
            state.sub = subId;
            state.vadeliKarsilastirmalar = [];
            if(id('vadeli-karsilastirma-container')) id('vadeli-karsilastirma-container').style.display = 'none';
            if(id('ad-container-vadeli-result')) id('ad-container-vadeli-result').innerHTML = '';
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(id('nav-' + subId)) id('nav-' + subId).classList.add('active');
            
            id('app-badge-title').innerText = NAV_LABELS[subId];
            id('results').classList.add('hidden');
            id('info-area').classList.add('hidden');
            renderForm();
        }

        function setFaizTipi(tip) {
            state.faizTipi = tip;
            let val = parseFloat(id('val-faiz').value.replace(',','.')) || 0;
            id('val-faiz').value = tip === 'yillik' ? (val * 12).toFixed(2).replace('.',',') : (val / 12).toFixed(2).replace('.',',');
            id('faiz-tip-aylik').className = `px-2 py-1 text-[10px] font-bold rounded-md ${tip==='aylik'?'bg-amber-500 text-black':'text-[var(--apple-text-muted)]'} transition-all`;
            id('faiz-tip-yillik').className = `px-2 py-1 text-[10px] font-bold rounded-md ${tip==='yillik'?'bg-amber-500 text-black':'text-[var(--apple-text-muted)]'} transition-all`;
        }

        function renderForm() {
            const s = state.sub;
            let currInfo = s === 'vadeli-tl' ? 'Stopaj: 6 Ay %17.5 | 1 Yıl %15 | 1+ Yıl %10' : 'Stopaj: Tüm vadelerde %25';
            id('info-area').innerHTML = `<div class="info-badge mb-3"><i class="fa-solid fa-vault"></i> Mevduat ${currInfo}</div>`;
            id('info-area').classList.remove('hidden');

            let currSymbol = 'TL';
            if (s === 'vadeli-usd') currSymbol = 'USD';
            else if (s === 'vadeli-eur') currSymbol = 'EUR';
            else if (s === 'vadeli-altin') currSymbol = 'GR';

            let dFaiz = "42,00";
            let vDays = 32;
            state.faizTipi = 'yillik';
            
            let mappedSub = s.replace('vadeli-', '');
            if (globalRates && globalRates['vadeli'] && globalRates['vadeli'][mappedSub]) {
                let defaultItem = globalRates['vadeli'][mappedSub];
                dFaiz = parseFloat(defaultItem.rate).toFixed(2).replace('.', ',');
                state.faizTipi = defaultItem.type;
            }

            let startDateObj = new Date(); let startDateStr = startDateObj.toISOString().split('T')[0];
            let firstDateObj = new Date(startDateObj);
            firstDateObj.setDate(firstDateObj.getDate() + vDays); 
            let firstDateStr = firstDateObj.toISOString().split('T')[0];
            
            let html = `<div class="grid grid-cols-2 gap-3 mb-3">
                <div class="input-card mb-0"><span class="label-text">Başlangıç</span><input type="date" id="date-start" class="apple-input text-base" value="${startDateStr}" onchange="onStartDateChange()"></div>
                <div class="input-card mb-0"><span class="label-text">İlk Vade Bitiş</span><input type="date" id="date-first" class="apple-input text-base" value="${firstDateStr}" onchange="onDateFirstChange()"></div>
            </div>
            <div class="input-card"><span class="label-text">Anapara (${currSymbol})</span><input type="text" id="val-tutar" inputmode="numeric" class="apple-input" placeholder="0" oninput="mask(this)"></div>`;

            html += `<div class="grid grid-cols-2 gap-3 mb-3 mt-3">
                <div class="input-card mb-0"><span class="label-text">Gün (Vade)</span><input type="number" id="val-vade" class="apple-input" value="${vDays}" oninput="onVadeChange()"></div>
                <div class="input-card mb-0"><span class="label-text">Tekrar Sayısı</span><input type="number" id="val-tekrar" class="apple-input" value="1" min="1" placeholder="Opsiyonel"></div>
            </div>
            <div class="input-card mb-3"><span class="label-text">Faiz Oranı (%)</span>
                <div class="flex items-center justify-between gap-1 mt-0.5"><input type="text" id="val-faiz" inputmode="numeric" class="apple-input flex-1 min-w-[50px]" value="${dFaiz}">
                <div class="flex bg-[rgba(128,128,128,0.1)] p-0.5 rounded-lg border border-[rgba(128,128,128,0.2)] flex-shrink-0">
                    <button id="faiz-tip-aylik" type="button" class="px-2 py-1 text-[10px] font-bold rounded-md ${state.faizTipi === 'aylik' ? 'bg-amber-500 text-black' : 'text-[var(--apple-text-muted)]'} transition-all" onclick="setFaizTipi('aylik')">AYLIK</button>
                    <button id="faiz-tip-yillik" type="button" class="px-2 py-1 text-[10px] font-bold rounded-md ${state.faizTipi === 'yillik' ? 'bg-amber-500 text-black' : 'text-[var(--apple-text-muted)]'} transition-all" onclick="setFaizTipi('yillik')">YILLIK</button>
                </div></div>
            </div>`;

            html += `<button type="button" class="action-btn" onmousedown="event.preventDefault()" onclick="executeCalculation()">HESAPLA</button>`;
            id('form-content').innerHTML = html;
        }

        function executeCalculation() {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            
            const T = getRaw('val-tutar');
            let startD = new Date(id('date-start').value), endD = new Date(id('date-first').value);
            let G_from_dates = Math.round((endD - startD) / 86400000);
            const G = G_from_dates > 0 ? G_from_dates : parseInt(id('val-vade').value);
            const tekrar = parseInt(id('val-tekrar').value) || 1;
            
            const moduleName = 'vadeli_' + state.sub.replace('vadeli-', '');
            trackEvent('calculation_start', { module: moduleName });

            if (T <= 0 || G <= 0 || isNaN(T) || isNaN(G)) {
                trackEvent('calculation_error', { module: moduleName, error_type: 'invalid_input' });
                showToast("Lütfen geçerli bir tutar ve vade süresi giriniz!");
                return;
            }

            if (!isBusinessDay(endD)) { showToast("Uyarı: İlk vade bitiş tarihi hafta sonu veya tatil gününe denk gelmektedir!"); }

            let F = parseFloat(id('val-faiz').value.replace(',','.'))/100;
            if (state.faizTipi === 'aylik') { F = F * 12; } 
            
            let stopaj = 0.25;
            if(state.sub === 'vadeli-tl') { stopaj = G < 180 ? 0.175 : (G < 365 ? 0.15 : 0.10); }

            let currentBalance = T;
            let totalBrut = 0;
            let totalNet = 0;
            let totalKesinti = 0;
            let calcRows = [];
            let loopStartDate = new Date(startD);

            for (let i = 1; i <= tekrar; i++) {
                let periodBrut = (currentBalance * F * G) / 365;
                let periodKesinti = periodBrut * stopaj;
                let periodNet = periodBrut - periodKesinti;

                let prevBalance = currentBalance;
                currentBalance += periodNet;

                totalBrut += periodBrut;
                totalNet += periodNet;
                totalKesinti += periodKesinti;

                let periodEndDate = new Date(loopStartDate);
                periodEndDate.setDate(periodEndDate.getDate() + G);

                calcRows.push({
                    i: i,
                    date: periodEndDate.toLocaleDateString('tr-TR'),
                    oran: (F * 100).toFixed(2),
                    ana: prevBalance,
                    f: periodBrut,
                    k: periodKesinti,
                    bak: currentBalance
                });

                loopStartDate = periodEndDate;
            }

            const totalDays = tekrar * G;
            const esdegerYillikBrut = (totalBrut / T) * (365 / totalDays) * 100;

            state.lastCalc = calcRows;
            state.calcMeta = { cat: 'Vadeli Finans', tur: NAV_LABELS[state.sub], faiz: id('val-faiz').value, tutar: T, aylik: totalNet, toplam: currentBalance, tekrar: tekrar, totalDays: totalDays };
            
            let resultHtml = [
                {l: (tekrar > 1 ? "Toplam Bileşik Getiri (Net)" : "Net Getiri"), v: format(totalNet), h:true}, 
                {l: "Toplam Süre (Gün)", v: totalDays}, 
                {l: "Toplam Brüt Faiz", v: format(totalBrut)}
            ];

            if (tekrar > 1) {
                resultHtml.push({l: "Eşdeğer Yıllık Oran (Brüt)", v: "%" + fN(esdegerYillikBrut), highlight: true});
                resultHtml.push({l: `Toplam Stopaj (%${stopaj*100})`, v: format(totalKesinti)});
            } else {
                resultHtml.push({l: `Stopaj Kesintisi (%${stopaj*100})`, v: format(totalKesinti)});
            }

            resultHtml.push({l: "Vade Sonu Bakiye", v: format(currentBalance)});

            id('result-rows').innerHTML = resultHtml.map(d => `<div class="flex justify-between px-3 py-1.5 border-b border-[var(--apple-table-border)] ${d.h?'bg-[var(--apple-badge-bg)] rounded-xl':''} ${d.highlight ? 'bg-amber-500/10 rounded-lg' : ''}"><span class="text-[10px] uppercase ${d.highlight ? 'text-amber-600' : 'text-[var(--apple-text-muted)]'} font-bold">${d.l}</span><span class="font-bold text-[var(--apple-yellow)]">${d.v}</span></div>`).join('');
            
            id('plan-thead').innerHTML = `<tr><th>No</th><th>Tarih</th><th>Oran</th><th>Anapara</th><th>Brüt Faiz</th><th>Stopaj</th><th class="text-right">Bakiye</th></tr>`;
            
            renderAds('vadeliResult', 'ad-container-vadeli-result');
            trackEvent('calculation_complete', { module: moduleName });
            id('results').classList.remove('hidden'); 
            
            state.currentVadeliNet = totalNet; state.currentVadeliDays = totalDays; state.currentVadeliTutar = T; state.currentVadeliOran = (tekrar > 1) ? esdegerYillikBrut : (F * 100);
            setTimeout(() => id('results').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
        }

        function addVadeliKarsilastirma() {
            state.vadeliKarsilastirmalar.push({
                tutar: state.currentVadeliTutar, net: state.currentVadeliNet, days: state.currentVadeliDays, oran: state.currentVadeliOran, tekrar: state.calcMeta.tekrar, id: state.vadeliKarsilastirmalar.length + 1
            });
            renderVadeliKarsilastirma(); showToast("Seçenek karşılaştırmaya eklendi!");
        }

        function renderVadeliKarsilastirma() {
            const container = id('vadeli-karsilastirma-container');
            if (state.vadeliKarsilastirmalar.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'block';

            id('karsilastirma-body').innerHTML = state.vadeliKarsilastirmalar.map(item => `
                <tr><td class="text-center font-bold text-[var(--apple-text-muted)]">${item.id}</td><td>${format(item.tutar)}</td><td>${item.days}</td><td>%${fN(item.oran)}${item.tekrar > 1 ? '<br><span style="font-size:7px;color:var(--apple-yellow);">BİLEŞİK</span>' : ''}</td><td class="text-right font-bold" style="color:var(--apple-yellow);">${format(item.net)}</td></tr>
            `).join('');
            
            const farklarDiv = id('karsilastirma-farklar');
            farklarDiv.innerHTML = '';
            
            if (state.vadeliKarsilastirmalar.length > 1) {
                let farkHtml = '';
                for (let i = 1; i < state.vadeliKarsilastirmalar.length; i++) {
                    let prev = state.vadeliKarsilastirmalar[i-1], curr = state.vadeliKarsilastirmalar[i], diff = curr.net - prev.net;
                    let colorClass = diff > 0 ? 'text-[var(--success)]' : (diff < 0 ? 'text-[var(--danger)]' : 'text-[var(--apple-text-muted)]');
                    let sign = diff > 0 ? '+' : '';
                    farkHtml += `<div class="flex justify-between items-center text-[11px] bg-[var(--apple-badge-bg)] p-2.5 rounded-xl border border-[var(--apple-badge-border)] shadow-sm"><span class="text-[var(--apple-text)] font-bold">${curr.id}. Hesap ile ${prev.id}. Hesap Net Getiri Farkı:</span><span class="font-extrabold text-sm ${colorClass}">${sign}${format(diff)}</span></div>`;
                }
                farklarDiv.innerHTML = farkHtml;
            } else {
                farklarDiv.innerHTML = `<div class="text-center text-[10px] text-[var(--apple-text-muted)] py-2 font-semibold">Net getiri farkını görmek için yeni bir tutar/oran hesaplayıp tekrar listeye ekleyin.</div>`;
            }
        }

        function clearVadeliKarsilastirma() { state.vadeliKarsilastirmalar = []; renderVadeliKarsilastirma(); showToast("Karşılaştırma tablosu temizlendi."); }
        
        function addToCalendar() {
            if(!state.lastCalc) return;
            const finalRow = state.lastCalc[state.lastCalc.length - 1];
            const dateParts = finalRow.date.split('.'); 
            if (dateParts.length !== 3) return;

            const dtStart = `${dateParts[2]}${dateParts[1]}${dateParts[0]}T090000`;
            const dtEnd = `${dateParts[2]}${dateParts[1]}${dateParts[0]}T100000`;
            const tutar = format(state.currentVadeliTutar); const net = format(state.currentVadeliNet);
            const title = `Vhesap: ${NAV_LABELS[state.sub]} Vade Sonu`;
            const description = `Mevduat vade sonu geldi.\\n\\nAnapara: ${tutar}\\nNet Getiri: ${net}`;
            
            const icsContent = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Vhesap//TR", "BEGIN:VEVENT", `DTSTART:${dtStart}`, `DTEND:${dtEnd}`, `SUMMARY:${title}`, `DESCRIPTION:${description}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
            
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url;
            link.setAttribute('download', 'Vhesap_Vade_Sonu.ics'); document.body.appendChild(link); link.click(); document.body.removeChild(link);
            showToast("Takvim dosyası oluşturuldu. Tıklayarak takvime kaydedebilirsiniz.");
        }

        function openPlan() {
            if(!state.lastCalc) return;
            
            trackEvent('payment_plan_open', { module: 'vadeli_' + state.sub.replace('vadeli-', '') });

            id('plan-subtitle').innerText = "Vadeli Finans / " + NAV_LABELS[state.sub];
            let planAdHtml = getAdHtml('planMid');
            id('plan-body').innerHTML = state.lastCalc.map((r, idx) => {
                let rowHtml = `<tr><td>${r.i}</td><td>${r.date}</td><td class="font-bold">%\u200B${r.oran}</td><td>${format(r.ana)}</td><td style="color:var(--apple-yellow);">${format(r.f)}</td><td class="text-red-500">${format(r.k)}</td><td class="text-right font-bold">${format(r.bak)}</td></tr>`;
                if ((idx + 1) % 20 === 0 && planAdHtml) {
                    rowHtml += `<tr><td colspan="7" class="p-0 border-b border-[rgba(128,128,128,0.08)]"><div class="px-3 py-1 bg-[rgba(128,128,128,0.02)]">${planAdHtml}</div></td></tr>`;
                }
                return rowHtml;
            }).join('');
            id('plan-modal').style.display = 'flex';
        }

        function closePlan() { id('plan-modal').style.display = 'none'; }
        function closePlanOutside(e) { if(e.target.id === 'plan-modal') closePlan(); }

        function downloadPDF() { 
            trackEvent('payment_plan_download_pdf');
            const wrapper = id('pdf-template-wrapper'); let contentHtml = '';
            const dStr = new Date().toLocaleDateString('tr-TR') + ' ' + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
            const refId = 'VH-' + Math.random().toString(36).substr(2, 8).toUpperCase();
            const m = state.calcMeta;

            contentHtml += `
                <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1f2937; max-width: 900px; margin: 0 auto;">
                    <table style="width: 100%; border-bottom: 3px solid #f59e0b; padding-bottom: 15px; margin-bottom: 25px;">
                        <tr>
                            <td style="vertical-align: middle;">
                                <h1 style="margin: 0; font-size: 28px; color: #111827; letter-spacing: -0.5px;">Vhesap</h1>
                                <p style="margin: 4px 0 0 0; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px;">Gelişmiş Finansal Simülasyon</p>
                            </td>
                            <td style="text-align: right; vertical-align: bottom;">
                                <h2 style="margin: 0 0 4px 0; font-size: 16px; color: #374151;">FİNANSAL ANALİZ RAPORU</h2>
                                <p style="margin: 0; font-size: 10px; color: #6b7280;">Tarih: <strong>${dStr}</strong> | Ref: <strong>${refId}</strong></p>
                            </td>
                        </tr>
                    </table>
                    
                    <div style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px 20px; margin-bottom: 25px;">
                        <table style="width: 100%; font-size: 12px;">
                            <tr>
                                <td style="padding: 6px 0; width: 50%;"><strong>Kategori:</strong> ${m.cat}</td>
                                <td style="padding: 6px 0; width: 50%;"><strong>Anapara:</strong> <span style="font-weight:bold; color:#111827;">${format(m.tutar)}</span></td>
                            </tr>
                            <tr>
                                <td style="padding: 6px 0;"><strong>Döviz/Para Cinsi:</strong> ${m.tur}</td>
                                <td style="padding: 6px 0;"><strong>Net Getiri:</strong> <span style="color:#d97706; font-weight:bold; font-size:14px;">${format(m.aylik)}</span></td>
                            </tr>
                            <tr>
                                <td style="padding: 6px 0;"><strong>Faiz/Getiri Oranı:</strong> %${m.faiz}</td>
                                <td style="padding: 6px 0;"><strong>Vade Sonu Bakiye:</strong> <span style="font-weight:bold;">${format(m.toplam)}</span></td>
                            </tr>
                            <tr>
                                <td style="padding: 6px 0;"><strong>Tekrar Sayısı:</strong> ${m.tekrar}</td>
                                <td style="padding: 6px 0;"><strong>Toplam Süre:</strong> ${m.totalDays} Gün</td>
                            </tr>
                        </table>
                    </div>

                    <h3 style="font-size: 14px; margin-bottom: 10px; color: #111827; border-bottom: 1px solid #d1d5db; padding-bottom: 4px;">Vade Sonu Detayı</h3>
                    <table style="width: 100%; font-size: 10px; border-collapse: collapse; margin-bottom: 25px; text-align: left;">
                        <thead>
                            <tr style="background-color: #f3f4f6; color: #374151;">
                                <th style="padding: 8px; border: 1px solid #e5e7eb;">No</th>
                                <th style="padding: 8px; border: 1px solid #e5e7eb;">Tarih</th>
                                <th style="padding: 8px; border: 1px solid #e5e7eb; text-align: center;">Oran</th>
                                <th style="padding: 8px; border: 1px solid #e5e7eb; text-align: right;">Anapara</th>
                                <th style="padding: 8px; border: 1px solid #e5e7eb; text-align: right;">Brüt Faiz</th>
                                <th style="padding: 8px; border: 1px solid #e5e7eb; text-align: right;">Stopaj</th>
                                <th style="padding: 8px; border: 1px solid #e5e7eb; text-align: right;">Bakiye</th>
                            </tr>
                        </thead>
                        <tbody>`;

            if(state.lastCalc) {
                state.lastCalc.forEach((r, i) => {
                    let bg = i % 2 === 0 ? '#ffffff' : '#f9fafb';
                    contentHtml += `<tr style="background-color: ${bg};">
                        <td style="padding: 8px; border: 1px solid #e5e7eb;">${r.i}</td>
                        <td style="padding: 8px; border: 1px solid #e5e7eb;">${r.date}</td>
                        <td style="padding: 8px; border: 1px solid #e5e7eb; text-align: center; font-weight:bold;">%${r.oran}</td>
                        <td style="padding: 8px; border: 1px solid #e5e7eb; text-align: right;">${format(r.ana)}</td>
                        <td style="padding: 8px; border: 1px solid #e5e7eb; text-align: right; color:#b45309;">${format(r.f)}</td>
                        <td style="padding: 8px; border: 1px solid #e5e7eb; text-align: right;">${format(r.k)}</td>
                        <td style="padding: 8px; border: 1px solid #e5e7eb; text-align: right; font-weight:bold;">${format(r.bak)}</td>
                    </tr>`;
                });
            }
            contentHtml += `</tbody></table>
                    <div style="margin-top: 30px; padding-top: 15px; border-top: 1px solid #e5e7eb; font-size: 9px; color: #9ca3af; text-align: center;">
                        <p style="margin: 0;">Bu rapor Vhesap Platformu tarafından elektronik olarak üretilmiştir. Gösterilen veriler bilgi amaçlı olup resmi bir teklif veya bağlayıcı taahhüt niteliği taşımaz.</p>
                        <p style="margin: 4px 0 0 0;">&copy; ${new Date().getFullYear()} Vhesap Finans. Tüm hakları saklıdır.</p>
                    </div>
                </div>`;

            wrapper.innerHTML = contentHtml; document.body.classList.add('pdf-mode');

            setTimeout(() => {
                html2pdf().set({ 
                    margin: [10, 10, 10, 10], filename: `Vhesap_Vadeli_${refId}.pdf`, image: { type: 'jpeg', quality: 1.0 }, 
                    html2canvas: { scale: 2, useCORS: true, logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(wrapper).save().then(() => { 
                    document.body.classList.remove('pdf-mode'); showToast("PDF Başarıyla Kaydedildi."); 
                });
            }, 300);
        }
    </script>
</body>
</html>
